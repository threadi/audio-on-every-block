name: Build release zip

on:
    push:
        tags:
            - '*'

jobs:
    build:
        name: Build release zip
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup WP-CLI
              uses: godaddy-wordpress/setup-wp-cli@1

            - name: Run package installs and builds
              run: |
                  composer install
                  npm i
                  npm run build

            - name: Run PHPStan check
              run: vendor/bin/phpstan analyse

            - name: Run WordPress Coding Standard fixes
              run: vendor/bin/phpcbf .

            - name: Run WordPress Coding Standard checks
              run: vendor/bin/phpcs .

            - name: Set version number 1
              uses: richardrigutins/replace-in-files@v3
              with:
                  files: 'audio-on-every-block.php'
                  search-text: '@@VersionNumber@@'
                  replacement-text: ${{ github.ref_name }}

            - name: Set version number 2
              uses: richardrigutins/replace-in-files@v3
              with:
                  files: 'readme.txt'
                  search-text: '@@VersionNumber@@'
                  replacement-text: ${{ github.ref_name }}

            - name: Create ZIP release
              run: |
                  rm -fr assets
                  rm -fr build
                  rm -fr releases
                  rm -fr languages
                  rm -fr src
                  rm -fr svn
                  rm changelog.md
                  rm readme.md
                  cd ..
                  zip -r -q ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/* -x "*/.git/*" "*/.github/*" "*/blocks/*/src/*" "*/doc/*" "*/.phpcs.xml.dist" "*/composer.json" "*/composer.lock" "*/package.json" "*/package-lock.json" "*/.gitignore" "*/vendor/*" "*/node_modules/*" "/.editorconfig"
                  cp ${{ github.event.repository.name }}_${{ github.ref_name }}.zip ${{ github.event.repository.name }}/

            - name: Smoke test the release zip in WordPress Playground
              run: |
                set -o pipefail
                mkdir -p /tmp/smoke
                unzip -q ${{ github.event.repository.name }}_*.zip -d /tmp/smoke
                
                npx @wp-playground/cli@latest run-blueprint \
                --blueprint=./.github/blueprints/smoke.json \
                --mount=/tmp/smoke/${{ github.event.repository.name }}:/wordpress/wp-content/plugins/${{ github.event.repository.name }} \
                --verbosity=debug \
                --debug \
                2>&1 | tee /tmp/smoke.log
                
                echo "----- Vollständiges Playground-Log -----"
                cat /tmp/smoke.log
                
                echo "----- Inhalt smoke-result.txt -----"
                cat /tmp/smoke/${{ github.event.repository.name }}/smoke-result.txt || echo "(File not found)"
                
                if ! grep -q "SMOKE_OK" /tmp/smoke/${{ github.event.repository.name }}/smoke-result.txt; then
                echo "::error::SMOKE_OK not found in smoke-result.txt - check log above."
                exit 1
                fi

            - name: Create Release
              uses: softprops/action-gh-release@v3
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  files: ${{ github.event.repository.name }}_${{ github.ref_name }}.zip
